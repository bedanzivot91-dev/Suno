name: Suno Pesme Studio V1 Windows Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Suno-Pesme-Studio-V1/**'
      - '.github/workflows/suno-pesme-studio-v1.yml'
  push:
    branches: [ main ]
    paths:
      - 'Suno-Pesme-Studio-V1/**'
      - '.github/workflows/suno-pesme-studio-v1.yml'
  workflow_dispatch:

concurrency:
  group: suno-pesme-studio-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source syntax
        shell: powershell
        run: |
          go version
          node --check ./Suno-Pesme-Studio-V1/Program/app/web/task3-dashboard.js
          node --check ./Suno-Pesme-Studio-V1/Program/app/web/task10-controls.js
          [scriptblock]::Create((Get-Content ./Suno-Pesme-Studio-V1/github_build/PREPARE_V1_SOURCE.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./Suno-Pesme-Studio-V1/github_build/BUILD_FINAL.ps1 -Raw)) | Out-Null
          [scriptblock]::Create((Get-Content ./Suno-Pesme-Studio-V1/github_build/APPLY_TASK3_DASHBOARD.ps1 -Raw)) | Out-Null

      - name: Build final self-contained Windows package
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          ./Suno-Pesme-Studio-V1/github_build/BUILD_FINAL.ps1 -Output "$PWD/dist"
          if ($LASTEXITCODE -ne 0) { throw "BUILD_FINAL.ps1 failed: $LASTEXITCODE" }

      - name: Apply current UI and audit every active control
        shell: powershell
        run: |
          $zip = Resolve-Path ./dist/Suno-Pesme-Studio-V1-Windows.zip
          $pkg = "$PWD/dist/pkg"
          Remove-Item $pkg -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip -DestinationPath $pkg -Force
          ./Suno-Pesme-Studio-V1/github_build/APPLY_TASK3_DASHBOARD.ps1 -PackageRoot $pkg
          if ($LASTEXITCODE -ne 0) { throw "UI patch/audit failed: $LASTEXITCODE" }
          python ./Suno-Pesme-Studio-V1/tests/UI_BUTTON_AUDIT.py "$pkg/Program/app/web"
          if ($LASTEXITCODE -ne 0) { throw 'Active UI control audit failed.' }
          $html = Get-Content "$pkg/Program/app/web/index.html" -Raw
          foreach($asset in @('task3-dashboard.js','task3-dashboard.css','task5-readable-ui.css','task10-controls.js')) {
            if($html -notmatch [regex]::Escape($asset)){ throw "Final UI does not load $asset" }
          }

      - name: Verify standalone desktop launcher and no ordinary browser
        shell: powershell
        env:
          SPS_DESKTOP_WINDOW_SELF_TEST: '1'
        run: |
          $src = Get-Content './Suno-Pesme-Studio-V1/github_build/launcher/main.go' -Raw
          if ($src -match 'SUNO_AUTO_OPEN=1') { throw 'Ordinary browser auto-open is enabled.' }
          if ($src -notmatch 'SUNO_AUTO_OPEN=0') { throw 'Browser auto-open is not explicitly disabled.' }
          if ($src -notmatch 'webview2\.NewWithOptions') { throw 'Embedded WebView2 desktop code is missing.' }
          $exe = Resolve-Path './dist/work/Program/Suno Pesme Studio.exe'
          Push-Location (Split-Path $exe)
          try {
            $out = & $exe 2>&1
            $code = $LASTEXITCODE
            $out | Out-Host
            if ($code -ne 0) { throw "Desktop launcher exit code: $code" }
            if (($out -join "`n") -notmatch 'SPS_DESKTOP_WINDOW_SELF_TEST_OK') { throw 'Desktop window self-test marker missing.' }
          } finally { Pop-Location }

      - name: Install actual package
        shell: powershell
        env:
          SPS_INSTALL_TEST_MODE: '1'
        run: |
          Push-Location './dist/pkg'
          try {
            $out = & ./INSTALIRAJ_PROGRAM.exe 2>&1
            $code = $LASTEXITCODE
            $out | Out-Host
            if ($code -ne 0) { throw "Installer exit code: $code" }
            if (($out -join "`n") -notmatch 'SPS_INSTALL_TEST_OK') { throw 'Installer marker missing.' }
          } finally { Pop-Location }

      - name: Import every installed first-party Python module
        shell: powershell
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'Programs/Suno Pesme Studio'
          $py = Join-Path $root 'python/python.exe'
          $app = Join-Path $root 'app'
          $mods = Get-ChildItem $app -Filter '*.py' -File | Where-Object { $_.BaseName -notmatch '^__' }
          if ($mods.Count -lt 22) { throw "Installed module count too small: $($mods.Count)" }
          foreach($m in $mods) {
            & $py -c "import sys;sys.path.insert(0,r'$app');__import__('$($m.BaseName)')"
            if ($LASTEXITCODE -ne 0) { throw "Import failed: $($m.Name)" }
          }

      - name: Installed launcher self-test
        shell: powershell
        env:
          SPS_LAUNCHER_SELF_TEST: '1'
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'Programs/Suno Pesme Studio'
          Push-Location $root
          try {
            $out = & './Suno Pesme Studio.exe' 2>&1
            $code = $LASTEXITCODE
            $out | Out-Host
            if ($code -ne 0) { throw "Launcher exit code: $code" }
            if (($out -join "`n") -notmatch 'SPS_LAUNCHER_SELF_TEST_OK') { throw 'Launcher marker missing.' }
          } finally { Pop-Location }

      - name: Actual uninstaller test
        shell: powershell
        env:
          SPS_UNINSTALL_TEST_MODE: '1'
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'Programs/Suno Pesme Studio'
          $un = Join-Path $root 'Deinstaliraj Suno Pesme Studio.exe'
          $out = & $un 2>&1
          $code = $LASTEXITCODE
          $out | Out-Host
          if ($code -ne 0) { throw "Uninstaller exit code: $code" }
          if (($out -join "`n") -notmatch 'SPS_UNINSTALL_TEST_OK') { throw 'Uninstaller marker missing.' }
          for($i=0; $i -lt 30 -and (Test-Path $root); $i++){ Start-Sleep -Milliseconds 500 }
          if(Test-Path $root){ throw 'Installed program folder was not removed.' }
          Write-Host 'WINDOWS_BUILD_VERIFICATION_OK'
