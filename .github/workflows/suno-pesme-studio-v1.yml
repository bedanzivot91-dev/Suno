name: Suno Pesme Studio V1 Windows Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Suno-Pesme-Studio-V1/**'
      - '.github/workflows/suno-pesme-studio-v1.yml'
  push:
    branches: [ main ]
    paths:
      - 'Suno-Pesme-Studio-V1/**'
      - '.github/workflows/suno-pesme-studio-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: suno-pesme-studio-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build tools
        shell: powershell
        run: |
          go version
          tar --version

      - name: Verify desktop launcher contract
        shell: powershell
        run: |
          $launcher = Get-Content ./Suno-Pesme-Studio-V1/github_build/launcher/main.go -Raw
          $gomod = Get-Content ./Suno-Pesme-Studio-V1/github_build/launcher/go.mod -Raw
          if ($launcher -match 'SUNO_AUTO_OPEN=1') { throw 'Launcher i dalje uključuje automatsko otvaranje browsera.' }
          if ($launcher -notmatch 'SUNO_AUTO_OPEN=0') { throw 'Launcher ne zaključava SUNO_AUTO_OPEN=0.' }
          if ($launcher -notmatch 'NewWithOptions') { throw 'Launcher nema native WebView2 prozor.' }
          if ($launcher -notmatch 'SPS_DESKTOP_PROBE') { throw 'Launcher nema desktop WebView2 probe.' }
          if ($gomod -notmatch 'github.com/jchv/go-webview2') { throw 'WebView2 dependency nije zaključana u launcher go.mod.' }
          Write-Host 'DESKTOP LAUNCHER CONTRACT OK'

      - name: Build complete Windows package
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          $ok = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            Write-Host "WINDOWS BUILD ATTEMPT $attempt/4"
            try {
              ./Suno-Pesme-Studio-V1/github_build/BUILD_COMPLETE.ps1 -Output "$PWD/dist"
              if ($LASTEXITCODE -eq 0 -or $null -eq $LASTEXITCODE) {
                $ok = $true
                break
              }
            } catch {
              Write-Host "BUILD ATTEMPT $attempt FAILED: $($_.Exception.Message)" -ForegroundColor Yellow
            }
            if ($attempt -lt 4) { Start-Sleep -Seconds (10 * $attempt) }
          }
          if (-not $ok) { throw 'Windows package build failed after 4 attempts.' }

      - name: Force canonical Panako and desktop UI into final ZIP
        shell: powershell
        run: |
          $zip = Resolve-Path ./dist/Suno-Pesme-Studio-V1-Windows.zip
          $canonical = Resolve-Path ./Suno-Pesme-Studio-V1/Program/plugins/INSTALIRAJ_PANAKO_OBAVEZNO.ps1
          $desktopCss = Resolve-Path ./Suno-Pesme-Studio-V1/Program/app/web/desktop_override.css
          $desktopJs = Resolve-Path ./Suno-Pesme-Studio-V1/Program/app/web/desktop_home.js
          $patchDir = "$PWD/dist/desktop-patched-package"
          Remove-Item $patchDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $zip -DestinationPath $patchDir -Force

          $panakoDest = Join-Path $patchDir 'Program/plugins/INSTALIRAJ_PANAKO_OBAVEZNO.ps1'
          Copy-Item $canonical $panakoDest -Force
          $panakoText = Get-Content $panakoDest -Raw
          if ($panakoText -notmatch 'e4b0e1dbb55e340bc66c90bac0ceb82b2cf84211') { throw 'Final ZIP nema pinned Panako commit.' }
          if ($panakoText -notmatch 'gradle-7\.3\.3-bin\.zip') { throw 'Final ZIP nema Gradle 7.3.3 Panako popravku.' }

          $webDir = Join-Path $patchDir 'Program/app/web'
          if (!(Test-Path $webDir)) { throw 'Final ZIP nema Program/app/web.' }
          Copy-Item $desktopCss (Join-Path $webDir 'desktop_override.css') -Force
          Copy-Item $desktopJs (Join-Path $webDir 'desktop_home.js') -Force
          $indexPath = Join-Path $webDir 'index.html'
          if (!(Test-Path $indexPath)) { throw 'Final ZIP nema web/index.html.' }
          $html = Get-Content $indexPath -Raw
          if ($html -notmatch 'desktop_override\.css') {
            $html = $html -replace '</head>', "  <link rel=\"stylesheet\" href=\"/assets/desktop_override.css\">`r`n</head>"
          }
          if ($html -notmatch 'desktop_home\.js') {
            $html = $html -replace '</body>', "  <script src=\"/assets/desktop_home.js\"></script>`r`n</body>"
          }
          Set-Content $indexPath $html -Encoding UTF8

          $patchedHtml = Get-Content $indexPath -Raw
          if ($patchedHtml -notmatch 'desktop_override\.css') { throw 'Desktop CSS nije učitan u finalnom index.html.' }
          if ($patchedHtml -notmatch 'desktop_home\.js') { throw 'Desktop home JS nije učitan u finalnom index.html.' }
          $cssText = Get-Content (Join-Path $webDir 'desktop_override.css') -Raw
          $jsText = Get-Content (Join-Path $webDir 'desktop_home.js') -Raw
          if ($cssText -notmatch 'sps-home-login-panel') { throw 'Final ZIP nema desktop readability/login CSS.' }
          if ($jsText -notmatch 'POVEŽI SUNO NALOG' -or $jsText -notmatch 'POVEŽI YOUTUBE NALOG') { throw 'Final ZIP nema centralne Suno/YouTube kontrole.' }

          Remove-Item $zip -Force
          Compress-Archive (Join-Path $patchDir '*') $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content ./dist/Suno-Pesme-Studio-V1-Windows.sha256 "$hash  Suno-Pesme-Studio-V1-Windows.zip" -Encoding Ascii
          Write-Host "CANONICAL DESKTOP PACKAGE VERIFIED: $hash"

      - name: Verify output and checksum
        shell: powershell
        run: |
          $zip = Resolve-Path ./dist/Suno-Pesme-Studio-V1-Windows.zip
          $shaFile = Resolve-Path ./dist/Suno-Pesme-Studio-V1-Windows.sha256
          $expected = ((Get-Content $shaFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "ZIP SHA256 mismatch: $actual != $expected" }
          if ((Get-Item $zip).Length -lt 120MB) { throw 'Windows ZIP je premali i nepotpun.' }
          Write-Host "ZIP VERIFIED: $actual"

      - name: Extract final ZIP exactly as user downloads it
        shell: powershell
        run: |
          $dst = "$PWD/dist/e2e-package"
          Remove-Item $dst -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive ./dist/Suno-Pesme-Studio-V1-Windows.zip -DestinationPath $dst -Force
          foreach ($p in @(
            'INSTALIRAJ_PROGRAM.exe',
            'DEINSTALIRAJ_PROGRAM.exe',
            'Program/Suno Pesme Studio.exe',
            'Program/python/python.exe',
            'Program/app/server.py',
            'Program/app/web/index.html',
            'Program/app/web/desktop_override.css',
            'Program/app/web/desktop_home.js',
            'Program/plugins/INSTALIRAJ_PANAKO_OBAVEZNO.ps1',
            'Program/tools/ffmpeg/bin/ffmpeg.exe',
            'Program/tools/ffmpeg/bin/ffprobe.exe',
            'Program/tools/yt-dlp/yt-dlp.exe',
            'Program/tools/deno/deno.exe',
            'Program/tools/fpcalc/fpcalc.exe'
          )) {
            if (!(Test-Path (Join-Path $dst $p))) { throw "Nedostaje u finalnom ZIP-u: $p" }
          }
          $panakoText = Get-Content (Join-Path $dst 'Program/plugins/INSTALIRAJ_PANAKO_OBAVEZNO.ps1') -Raw
          if ($panakoText -notmatch 'gradle-7\.3\.3-bin\.zip') { throw 'Raspakovani finalni ZIP nema Gradle 7.3.3 Panako fix.' }
          $finalIndex = Get-Content (Join-Path $dst 'Program/app/web/index.html') -Raw
          if ($finalIndex -notmatch 'desktop_override\.css' -or $finalIndex -notmatch 'desktop_home\.js') { throw 'Raspakovani ZIP nema desktop UI uključivanja.' }

      - name: Install final ZIP with actual installer EXE
        shell: powershell
        env:
          SPS_INSTALL_TEST_MODE: '1'
        run: |
          $pkg = Resolve-Path ./dist/e2e-package
          Push-Location $pkg
          try {
            $old = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $installOut = & ./INSTALIRAJ_PROGRAM.exe 2>&1
            $code = $LASTEXITCODE
            $ErrorActionPreference = $old
            $installOut | Out-Host
            if ($code -ne 0) { throw "Installer exit code: $code" }
            if (($installOut -join "`n") -notmatch 'SPS_INSTALL_TEST_OK') { throw 'Installer nije vratio SPS_INSTALL_TEST_OK.' }
          } finally { Pop-Location }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Suno Pesme Studio'
          foreach ($p in @(
            'Suno Pesme Studio.exe',
            'python/python.exe',
            'app/bootstrap.py',
            'app/server.py',
            'app/web/desktop_override.css',
            'app/web/desktop_home.js',
            'plugins/INSTALIRAJ_PANAKO_OBAVEZNO.ps1',
            'tools/ffmpeg/bin/ffmpeg.exe',
            'tools/yt-dlp/yt-dlp.exe',
            'tools/deno/deno.exe',
            'tools/fpcalc/fpcalc.exe',
            'Deinstaliraj Suno Pesme Studio.exe'
          )) {
            if (!(Test-Path (Join-Path $installed $p))) { throw "Instalacija nije postavila: $p" }
          }

      - name: Import every installed first-party Python module
        shell: powershell
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Suno Pesme Studio'
          $py = Join-Path $installed 'python/python.exe'
          $app = Join-Path $installed 'app'
          $modules = Get-ChildItem $app -Filter '*.py' -File | Where-Object { $_.BaseName -notmatch '^__' } | Sort-Object Name
          if ($modules.Count -lt 20) { throw "Premalo app modula u instalaciji: $($modules.Count)" }
          foreach ($m in $modules) {
            Write-Host "IMPORT TEST: $($m.BaseName)"
            $codeText = "import sys,traceback; sys.path.insert(0, r'$app'); name='$($m.BaseName)';`ntry:`n __import__(name); print('IMPORT_OK:'+name)`nexcept BaseException:`n traceback.print_exc(); raise"
            $old = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $out = & $py -c $codeText 2>&1
            $exitCode = $LASTEXITCODE
            $ErrorActionPreference = $old
            $out | Out-Host
            if ($exitCode -ne 0) { throw "Import nije uspeo: $($m.Name), exit=$exitCode" }
          }

      - name: Launch installed backend self-test without browser
        shell: powershell
        env:
          SPS_LAUNCHER_SELF_TEST: '1'
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Suno Pesme Studio'
          Push-Location $installed
          try {
            $old = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $launchOut = & './Suno Pesme Studio.exe' 2>&1
            $code = $LASTEXITCODE
            $ErrorActionPreference = $old
            $launchOut | Out-Host
            if ($code -ne 0) { throw "Launcher exit code: $code" }
            if (($launchOut -join "`n") -notmatch 'SPS_LAUNCHER_SELF_TEST_OK') { throw 'Launcher backend self-test nije prošao.' }
          } finally { Pop-Location }

      - name: Create actual native WebView2 desktop window
        shell: powershell
        env:
          SPS_DESKTOP_PROBE: '1'
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Suno Pesme Studio'
          Push-Location $installed
          try {
            $old = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $desktopOut = & './Suno Pesme Studio.exe' 2>&1
            $code = $LASTEXITCODE
            $ErrorActionPreference = $old
            $desktopOut | Out-Host
            if ($code -ne 0) { throw "Desktop WebView2 probe exit code: $code" }
            if (($desktopOut -join "`n") -notmatch 'SPS_DESKTOP_WEBVIEW2_OK') { throw 'Pravi WebView2 desktop prozor nije uspešno napravljen.' }
          } finally { Pop-Location }

      - name: Uninstall installed program with actual uninstaller EXE
        shell: powershell
        env:
          SPS_UNINSTALL_TEST_MODE: '1'
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Suno Pesme Studio'
          $un = Join-Path $installed 'Deinstaliraj Suno Pesme Studio.exe'
          $old = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          $uninstallOut = & $un 2>&1
          $code = $LASTEXITCODE
          $ErrorActionPreference = $old
          $uninstallOut | Out-Host
          if ($code -ne 0) { throw "Uninstaller exit code: $code" }
          if (($uninstallOut -join "`n") -notmatch 'SPS_UNINSTALL_TEST_OK') { throw 'Uninstaller nije vratio SPS_UNINSTALL_TEST_OK.' }
          $removed = $false
          for ($i = 0; $i -lt 20; $i++) {
            if (!(Test-Path $installed)) { $removed = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (-not $removed) { throw 'Program folder postoji i posle odložene deinstalacije.' }
          Write-Host 'SPS_UNINSTALL_FOLDER_REMOVED_OK'

      - name: Publish verified Windows ZIP to GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'suno-pesme-studio-v1-latest'
          $ErrorActionPreference = 'Continue'
          gh release view $tag *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'
          if (-not $releaseExists) {
            gh release create $tag --title 'Suno Pesme Studio V1 - Windows' --notes 'Kompletan Windows paket sa native WebView2 desktop prozorom, većim UI tekstom i Suno/YouTube prijavom na početnoj strani.' --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release nije mogao da se napravi.' }
          }
          gh release upload $tag ./dist/Suno-Pesme-Studio-V1-Windows.zip ./dist/Suno-Pesme-Studio-V1-Windows.sha256 --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP nije mogao da se postavi na GitHub Release.' }
